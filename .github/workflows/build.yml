name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Require compiled entrypoint
        run: test -f out/extension.js
      - run: npx @vscode/vsce package
      - name: Require VSIX
        run: test -n "$(ls -1 *.vsix 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: codix-vsix
          path: "*.vsix"
